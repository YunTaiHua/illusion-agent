[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "illusion-agent"
version = "0.4.7"
description = "Where fantasy meets functionality. The best of many worlds, refined into one intelligent agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "YunTaiHua", email = "3597489498@qq.com" },
]
keywords = ["ai", "cli", "coding-agent", "claude-code", "llm", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiofiles>=24.1.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "truststore>=0.10.0",
    "websockets>=12.0",
    "mcp>=2.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-aiofiles>=24.1.0",
]
feishu = [
    "lark-oapi>=1.4.0",
]
weixin = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "qrcode>=7.4.0",
]
all = [
    "illusion-agent[feishu,weixin]",
]

[project.scripts]
illusion = "illusion.cli:app"

[project.urls]
Homepage = "https://github.com/YunTaiHua/illusion-agent"
Repository = "https://github.com/YunTaiHua/illusion-agent"
Issues = "https://github.com/YunTaiHua/illusion-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/illusion"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "illusion/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "illusion/_frontend/tsconfig.json"
"frontend/terminal/src" = "illusion/_frontend/src"
"frontend/terminal/dist" = "illusion/_frontend/dist"
"frontend/web/dist" = "illusion/_web_dist"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# test_stderr_redirect.py 修改 root logger handler，与 logging plugin 的
# caplog handler 恢复机制冲突（AttributeError: getvalue），需禁用 logging plugin
# 运行该测试时用：pytest tests/test_utils/test_stderr_redirect.py -p no:logging

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true
