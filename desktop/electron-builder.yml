appId: com.illusionagent.desktop
productName: IllusionAgent
executableName: IllusionAgent
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  useZip: true
  differentialPackage: false
  shortcutName: IllusionAgent
  createDesktopShortcut: true

publish:
  provider: github
  owner: YunTaiHua
  repo: illusion-agent
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

extraResources:
  - from: resources/
    to: .

win:
  target: nsis
  icon: build/icon.ico

mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - AppImage
    - deb
  artifactName: IllusionAgent-${version}-${arch}.${ext}
  icon: build/icon.png
  category: Development
  maintainer: YunTaiHua <3597489498@qq.com>
  synopsis: IllusionAgent 桌面版 - Electron 壳，内置 Python / Node.js 运行时
