appId: com.illusionagent.desktop
productName: IllusionAgent
executableName: IllusionAgent
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  useZip: true
  differentialPackage: false
  shortcutName: IllusionAgent
  createDesktopShortcut: true

publish:
  provider: github
  owner: YunTaiHua
  repo: illusion-agent
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

extraResources:
  - from: resources/
    to: .

win:
  target: nsis
  icon: build/icon.ico
  # 显式设置无空格 artifactName（空格会导致三处命名分裂）：
  #   - electron-builder 本地产物 / GitHub 上传资产名含空格时被转成点号
  #   - latest.yml 的 URL 是 electron-builder 生成的"安全名"（连字符）
  #   - electron-updater 按 latest.yml 下载 → 404 → 更新失败
  # 统一为连字符命名，保证本地产物名 = GitHub 资产名 = latest.yml URL。
  artifactName: IllusionAgent-Setup-${version}.${ext}

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - AppImage
    - deb
  artifactName: IllusionAgent-${version}-${arch}.${ext}
  icon: build/icon.png
  category: Development
  maintainer: YunTaiHua <3597489498@qq.com>
  synopsis: IllusionAgent 桌面版 - Electron 壳，内置 Python / Node.js 运行时
