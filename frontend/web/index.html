<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Playfair+Display:wght@500..900&display=swap" rel="stylesheet" />
    <title>IllusionAgent</title>
    <script>
      // 预加载主题：在 React 渲染前应用 dark 类，避免深色模式 FOUC 闪烁
      (function() {
        try {
          var stored = localStorage.getItem('illusion-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* 忽略 */ }
      })();
    </script>
    <style>
      /* React 挂载前仅占位：不给 #root 设背景色，避免覆盖应用 body 背景
         （--body-bg 灰蓝）。首帧背景由 body 的 CSS 变量统一决定。 */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
