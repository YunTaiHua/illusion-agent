name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-timeout ruff
          pip install -e ".[dev,all]"

      - name: Lint
        run: ruff check src/

      - name: Test
        timeout-minutes: 20
        run: pytest tests/ -q --timeout=30

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 版本号已在 PyPI 上存在时跳过上传（视为成功），
          # 支持同一 tag 重新触发 CI 修复产物而不重复发布
          skip-existing: true
