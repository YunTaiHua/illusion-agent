name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build ruff pytest pytest-timeout
          pip install -e ".[dev,all]"

      - name: Lint (ruff)
        run: ruff check src/

      - name: Test
        timeout-minutes: 20
        run: pytest tests/ -q --timeout=30
